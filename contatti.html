<main class="contact-page">
  <section class="cp-wrap">
    <h1 class="cp-lead">Usa il modulo contatti a seguire per scrivermi una tua opinione, un suggerimento o anche più semplicemente per un saluto.<br>Sarò felice di risponderti.</h1>
    <form class="cp-form" action="https://formspree.io/xnqgband" method="POST">
      <input type="hidden" name="_next" value="messaggio-inviato.html">
      <div class="cf">
        <label for="fname">Nome <span>(obbligatorio)</span></label>
        <input type="text" name="nome" id="fname" required>
      </div>
      <div class="cf">
        <label for="email">E-mail <span>(obbligatorio)</span></label>
        <input type="email" name="email" id="email" required>
      </div>
      <div class="cf">
        <label for="message">Messaggio <span>(obbligatorio)</span></label>
        <textarea name="message" id="message" rows="6" required></textarea>
      </div>
      <div class="g-recaptcha" data-sitekey="6LfUdQosAAAAAHyve6rgprSuOLJ9LR0JEUpJHA0f"></div>
      <button type="submit" class="cbtn">Invia</button>
    </form>
  </section>
</main>
